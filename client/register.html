<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up · fieldnotes</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="page page--narrow">
    <div class="card auth-card">
      <h1>Create an account</h1>
      <p class="subtitle">Join fieldnotes and start posting.</p>

      <div id="formError" class="form-error"></div>

      <form id="registerForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" minlength="3" maxlength="30" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Sign up</button>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
